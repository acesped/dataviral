name: DATO WOW - Vigilar y renovar token Instagram

on:
  workflow_dispatch:
    inputs:
      renovar_ahora:
        description: 'Intentar renovación inmediata (token long-lived válido, >24h)'
        required: false
        type: boolean
        default: false
  schedule:
    # Comprobación diaria. Los lunes también intenta la renovación.
    - cron: '18 11 * * *'

permissions:
  contents: read

concurrency:
  group: dato-wow-instagram-token
  cancel-in-progress: false

jobs:
  token-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias mínimas
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'PyNaCl>=1.5,<2'

      - name: Verificar y renovar cuando corresponda
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_EXPECTED_USERNAME: dato_wow_
          IG_SECRET_MANAGER_TOKEN: ${{ secrets.IG_SECRET_MANAGER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_EVENT: ${{ github.event_name }}
          FORCE_REFRESH: ${{ inputs.renovar_ahora || false }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          # Los lunes hay renovación programada; los demás días solo validación.
          if [[ "$RUN_EVENT" == "schedule" && "$(date -u +%u)" == "1" ]]; then
            args+=(--refresh)
          fi
          if [[ "$RUN_EVENT" == "workflow_dispatch" && "$FORCE_REFRESH" == "true" ]]; then
            args+=(--refresh)
          fi
          python scripts/refresh_instagram_token.py "${args[@]}"
