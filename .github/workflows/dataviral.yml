
name: DATO WOW - Sismos - Instagram

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'ID sismico opcional; vacio = seleccion automatica'
        required: false
        default: ''
        type: string

      publish:
        description: 'Generar y publicar Reel automaticamente'
        required: true
        default: true
        type: boolean

      story:
        description: 'Publicar tambien Story'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: dataviral-instagram
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: '1'

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      IG_GRAPH_VERSION: 'v25.0'
      IG_EXPECTED_USERNAME: 'dato_wow_'

      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      DV_VOICE: 'es-CL-CatalinaNeural'

    steps:

      # 1. DESCARGAR REPOSITORIO

      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. PREPARAR PYTHON

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. INSTALAR DEPENDENCIAS SIN APT

      - name: Instalar dependencias Python y FFmpeg sin APT
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'Pillow>=10,<13' \
            'requests>=2.31,<3' \
            'edge-tts>=6,<8' \
            'mutagen>=1.47,<2' \
            'imageio-ffmpeg>=0.6,<1'

          # Obtener FFmpeg directamente desde imageio-ffmpeg.
          # No requiere apt-get ni descargar dependencias Ubuntu.

          mkdir -p "$RUNNER_TEMP/dato-wow-bin"

          FFMPEG_BIN="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"

          ln -sf "$FFMPEG_BIN" \
            "$RUNNER_TEMP/dato-wow-bin/ffmpeg"

          chmod +x "$FFMPEG_BIN"

          # Disponible para todos los pasos siguientes.

          echo "$RUNNER_TEMP/dato-wow-bin" >> "$GITHUB_PATH"

          "$FFMPEG_BIN" -hide_banner -version | head -n 1

      # 4. VERIFICAR PYTHON Y VIDEO

      - name: Verificar Python y codificadores de video
        shell: bash
        run: |
          set -euo pipefail

          test -f dataviral.py || {
            echo '::error::Falta dataviral.py'
            exit 1
          }

          python -m py_compile dataviral.py

          command -v ffmpeg >/dev/null || {
            echo '::error::No existe FFmpeg'
            exit 1
          }

          ffmpeg -hide_banner -encoders 2>/dev/null \
            | grep -q 'libx264' || {
              echo '::error::FFmpeg no incluye libx264'
              exit 1
            }

          python - <<'PY'
          import requests
          import edge_tts
          import imageio_ffmpeg
          import mutagen
          from PIL import Image

          print('Dependencias Python y FFmpeg disponibles.')
          PY

      # 5. VALIDAR INSTAGRAM

      - name: Validar credenciales de Instagram
        shell: bash

        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}

        run: |
          set -euo pipefail

          if [[ "$PUBLISH" == 'true' ]]; then

            [[ -n "${INSTAGRAM_TOKEN:-}" && \
               -n "${INSTAGRAM_USER_ID:-}" ]] || {
              echo '::error::Faltan secretos de Instagram'
              exit 1
            }

            [[ "$INSTAGRAM_USER_ID" =~ ^[0-9]+$ ]] || {
              echo '::error::INSTAGRAM_USER_ID debe ser numerico'
              exit 1
            }

            [[ "$IG_EXPECTED_USERNAME" == 'dato_wow_' ]] || {
              echo '::error::Cuenta de destino incorrecta'
              exit 1
            }

            echo 'Publicacion automatica solicitada para @dato_wow_.'

          else
            echo 'Modo vista previa; no se publicara.'
          fi

      # 6. GENERAR Y PUBLICAR REEL

      - name: Generar y publicar Reel sismico
        shell: bash
        timeout-minutes: 30

        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          STORY: ${{ inputs.story && 'true' || 'false' }}
          TOPIC: ${{ inputs.topic }}

        run: |
          set -euo pipefail

          args=(--out output_sismos)

          # Tema opcional.
          # Si esta vacio, Python selecciona uno automaticamente.

          if [[ -n "$TOPIC" ]]; then
            args+=(--topic "$TOPIC")
          fi

          # Publicacion autonoma, sin episode_json
          # ni approved_id.

          if [[ "$PUBLISH" == 'true' ]]; then

            args+=(--publish --auto-publish)

            if [[ "$STORY" == 'true' ]]; then
              args+=(--story)
            fi

          fi

          echo 'Ejecutando dataviral.py para @dato_wow_...'

          python dataviral.py "${args[@]}"

      # 7. GUARDAR RESULTADOS

      - name: Guardar video y evidencias
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: dato-wow-sismos-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            output_sismos/**/*.json
            output_sismos/**/*.mp4
            output_sismos/**/*.jpg
            output_sismos/**/*.png
            output_sismos/*.json
            output_sismos/*.mp4
            output_sismos/*.jpg
            output_sismos/*.png

          if-no-files-found: warn
          retention-days: 14
