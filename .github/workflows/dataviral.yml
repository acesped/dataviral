
name: DATO WOW - Sismos - Instagram

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'ID sísmico opcional; vacío = selección automática'
        required: false
        default: ''
        type: string

      publish:
        description: 'Publicar Reel automáticamente (desactiva para vista previa)'
        required: true
        default: true
        type: boolean

      story:
        description: 'Publicar también una Story'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: dataviral-instagram
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: '1'

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      IG_GRAPH_VERSION: 'v25.0'
      IG_EXPECTED_USERNAME: 'dato_wow_'

      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      DV_VOICE: es-CL-CatalinaNeural

    steps:
      # 1. DESCARGAR REPOSITORIO

      - name: Checkout
        uses: actions/checkout@v4

      # 2. CONFIGURAR PYTHON

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. INSTALAR FFMPEG Y TESSERACT

      - name: Instalar FFmpeg y Tesseract solo si faltan
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail

          packages=()

          if ! command -v ffmpeg >/dev/null 2>&1; then
            packages+=(ffmpeg)
          fi

          if ! command -v tesseract >/dev/null 2>&1; then
            packages+=(tesseract-ocr)
          fi

          if ! command -v tesseract >/dev/null 2>&1 || \
             ! tesseract --list-langs 2>/dev/null | grep -qx eng; then
            packages+=(tesseract-ocr-eng)
          fi

          if (( ${#packages[@]} > 0 )); then

            printf 'Instalando: %s\n' "${packages[*]}"

            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=45 \
              -o Acquire::https::Timeout=45 \
              -o Dpkg::Use-Pty=0 \
              update -qq

            sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=45 \
              -o Acquire::https::Timeout=45 \
              -o Dpkg::Use-Pty=0 \
              install -y --no-install-recommends \
              "${packages[@]}"

          else
            echo 'FFmpeg y Tesseract ya instalados.'
          fi

          command -v ffmpeg >/dev/null || {
            echo '::error::Falta FFmpeg'
            exit 1
          }

          command -v tesseract >/dev/null || {
            echo '::error::Falta Tesseract'
            exit 1
          }

          tesseract --list-langs 2>&1

      # 4. INSTALAR DEPENDENCIAS PYTHON

      - name: Instalar bibliotecas Python
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'Pillow>=10,<13' \
            'requests>=2.31,<3' \
            'edge-tts>=6,<8'

      # 5. VERIFICAR SCRIPT

      - name: Verificar programa y dependencias
        shell: bash
        run: |
          set -euo pipefail

          test -f dataviral.py || {
            echo '::error::Falta dataviral.py en la raíz del repositorio'
            exit 1
          }

          python -m py_compile dataviral.py

          python - <<'PY'
          import shutil
          from PIL import Image
          import requests
          import edge_tts

          assert shutil.which('ffmpeg'), 'Falta FFmpeg'
          assert shutil.which('tesseract'), 'Falta Tesseract'

          print('Python, Pillow, Requests y Edge TTS: OK')
          print('FFmpeg y Tesseract: OK')
          PY

      # 6. VALIDAR PUBLICACIÓN AUTOMÁTICA

      - name: Validar configuración para publicación automática
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          set -euo pipefail

          if [[ "$PUBLISH" == 'true' ]]; then

            [[ -n "${INSTAGRAM_TOKEN:-}" && \
               -n "${INSTAGRAM_USER_ID:-}" ]] || {
              echo '::error::Faltan credenciales de Instagram'
              exit 1
            }

            [[ "$INSTAGRAM_USER_ID" =~ ^[0-9]+$ ]] || {
              echo '::error::INSTAGRAM_USER_ID debe ser numérico'
              exit 1
            }

            [[ "${IG_EXPECTED_USERNAME:-}" == 'dato_wow_' ]] || {
              echo '::error::La cuenta debe ser @dato_wow_'
              exit 1
            }

            echo 'Publicación automática habilitada.'

          else
            echo 'Modo vista previa: no se publicará.'
          fi

      # 7. GENERAR Y PUBLICAR REEL

      - name: Generar y publicar Reel sísmico
        shell: bash
        timeout-minutes: 22

        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          STORY: ${{ inputs.story && 'true' || 'false' }}
          TOPIC: ${{ inputs.topic }}

        run: |
          set -euo pipefail

          args=(--out output_sismos)

          if [[ -n "$TOPIC" ]]; then
            args+=(--topic "$TOPIC")
          fi

          if [[ "$PUBLISH" == 'true' ]]; then

            args+=(--publish --auto-publish)

            if [[ "$STORY" == 'true' ]]; then
              args+=(--story)
            fi

          fi

          echo 'Ejecutando dataviral.py para @dato_wow_...'

          python dataviral.py "${args[@]}"

      # 8. GUARDAR RESULTADOS

      - name: Guardar video, portada, guion y evidencias
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: dato-wow-sismos-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            output_sismos/**/*.json
            output_sismos/**/*.mp4
            output_sismos/**/*.jpg
            output_sismos/**/*.png

          if-no-files-found: warn
          retention-days: 14
