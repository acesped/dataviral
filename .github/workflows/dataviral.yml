
name: DataViral - Gemini guiones y videos Instagram

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'ID opcional (vacio = siguiente episodio pendiente al publicar)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publicar un Reel que aparezca tambien en feed'
        required: true
        default: false
        type: boolean
      auto_publish:
        description: 'Permitir publicacion con verificacion automatica, sin revision humana'
        required: true
        default: false
        type: boolean
      approved_id:
        description: 'Si auto_publish=false, escribe ID revisado para publicar'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: dataviral-instagram
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      PYTHONUNBUFFERED: '1'

      GEMINI_MODEL: 'gemini-3.8-flash'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      IG_GRAPH_VERSION: 'v25.0'
      IG_EXPECTED_USERNAME: 'cazadores_de_terremotos'

      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar librerias y FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

          python -m pip install -r requirements.txt

      - name: Verificar catalogo y sintaxis
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile dataviral.py

          python - <<'PY'
          import dataviral

          episodes = dataviral.catalog()

          assert len(episodes) == 500
          assert len({ep['id'] for ep in episodes}) == 500

          print('Catalogo de 500 temas cargado')
          PY

      - name: Validar configuración
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          AUTO: ${{ inputs.auto_publish && 'true' || 'false' }}
          EPISODE: ${{ inputs.episode_id }}
          APPROVED: ${{ inputs.approved_id }}
        run: |
          set -euo pipefail

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::Falta GEMINI_API_KEY"
            exit 1
          fi

          if [[ "$PUBLISH" == true ]]; then

            if [[ -z "${INSTAGRAM_TOKEN:-}" || -z "${INSTAGRAM_USER_ID:-}" ]]; then
              echo "::error::Faltan secretos de Instagram"
              exit 1
            fi

            if [[ ! "$INSTAGRAM_USER_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::INSTAGRAM_USER_ID no es numerico"
              exit 1
            fi

            if [[ "${IG_EXPECTED_USERNAME:-}" != 'cazadores_de_terremotos' ]]; then
              echo "::error::Usuario Instagram inesperado"
              exit 1
            fi

            if [[ "$AUTO" != true ]]; then
              if [[ -z "$EPISODE" || "$EPISODE" != "$APPROVED" ]]; then
                echo "::error::Confirmar ID de episodio, o activar auto_publish"
                exit 1
              fi
            fi

          else
            echo "Modo prueba: no se necesitan credenciales de Instagram"
          fi

      - name: Confirmar modelo Gemini configurado
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import dataviral

          assert dataviral.GEMINI_MODEL == 'gemini-3.8-flash', (
              dataviral.GEMINI_MODEL
          )

          print('Modelo Gemini:', dataviral.GEMINI_MODEL)
          PY

      - name: Crear guion con IA, video y opcionalmente publicar
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          AUTO: ${{ inputs.auto_publish && 'true' || 'false' }}
          EPISODE: ${{ inputs.episode_id }}
          APPROVED: ${{ inputs.approved_id }}
        run: |
          set -euo pipefail

          args=()

          if [[ -n "$EPISODE" ]]; then
            args+=(--episode "$EPISODE")
          fi

          if [[ "$PUBLISH" == true ]]; then
            args+=(--publish)
          fi

          if [[ "$AUTO" == true ]]; then
            args+=(--auto-publish)
          fi

          if [[ -n "$APPROVED" ]]; then
            args+=(--approved-id "$APPROVED")
          fi

          python dataviral.py "${args[@]}"

      - name: Guardar guion y MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataviral-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*.json
            output/*.mp4
            output/*.jpg
          if-no-files-found: ignore
          retention-days: 7
